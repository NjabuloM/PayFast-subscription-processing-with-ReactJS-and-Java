services:
  backend:
    build: backend
    restart: always
    ports:
      - 8080:8080
    # Taken from your shell or a .env file next to this compose file
    environment:
      - MERCHANT_ID
      - MERCHANT_KEY
      - PASS_PHRASE
      - RETURN_URL
      - CANCEL_URL
      - NOTIFY_URL
      - PAYFAST_SANDBOX=${PAYFAST_SANDBOX:-true}
  frontend:
    build:
      context: frontend
      target: development
    ports:
      - 3000:3000
    volumes:
      - ./frontend/src:/code/src
      - /project/node_modules
    depends_on:
      - backend
    expose:
      - 3306
      - 33060