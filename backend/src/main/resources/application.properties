spring.datasource.url=jdbc:h2:mem:spazadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Honour X-Forwarded-For from local proxies/tunnels (ngrok, localtunnel, Docker), so the PayFast source-IP check
# sees PayFast's address rather than the tunnel's. Only proxies on private/loopback addresses are trusted.
server.forward-headers-strategy=native

# PayFast settings, read from environment variables
payfast.merchant-id=${MERCHANT_ID:}
payfast.merchant-key=${MERCHANT_KEY:}
payfast.pass-phrase=${PASS_PHRASE:}
payfast.return-url=${RETURN_URL:}
payfast.cancel-url=${CANCEL_URL:}
payfast.notify-url=${NOTIFY_URL:}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.verify-source-ip=${PAYFAST_VERIFY_SOURCE_IP:true}
payfast.verify-with-server=${PAYFAST_VERIFY_WITH_SERVER:true}
